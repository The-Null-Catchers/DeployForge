# DeployForge — single-server installation.
#
#   docker compose -f infra/compose.yaml --env-file .env up -d
#
# Trust boundaries (see docs/threat-model.md):
#   * Only `runner` mounts the Docker socket. Access to a rootful Docker
#     daemon is effectively root on the host.
#   * `api` and `worker` never see the Docker socket; they talk to the runner
#     over the private control network with HMAC-signed requests.
#   * PostgreSQL, Redis, the runner API and the Caddy admin API are not
#     published on host ports. The Caddy admin API is a unix socket in a
#     volume mounted only into `caddy`, `api` and `worker`.
#   * Application containers join per-application networks with Caddy and
#     the runner, never the control network.
name: deployforge

x-control-env: &control-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgresql://deployforge:${POSTGRES_PASSWORD}@postgres:5432/deployforge
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  SETUP_TOKEN: ${SETUP_TOKEN}
  SESSION_SECRET: ${SESSION_SECRET}
  DEPLOYFORGE_MASTER_KEYS: ${DEPLOYFORGE_MASTER_KEYS}
  DEPLOYFORGE_ACTIVE_KEY_ID: ${DEPLOYFORGE_ACTIVE_KEY_ID}
  RUNNER_URL: http://runner:7070
  RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}
  PROXY_PROBE_TOKEN: ${PROXY_PROBE_TOKEN}
  CADDY_ADMIN_URL: unix:///run/caddy-admin/admin.sock
  CADDY_PROBE_URL: http://caddy:9080
  APPS_DOMAIN: ${APPS_DOMAIN}
  APPS_URL_SCHEME: ${APPS_URL_SCHEME:-https}
  APPS_PUBLIC_PORT: ${APPS_PUBLIC_PORT:-0}
  TLS_MODE: ${TLS_MODE:-acme}
  ACME_EMAIL: ${ACME_EMAIL:-}
  ACME_CA: ${ACME_CA:-}
  PUBLIC_IPV4: ${PUBLIC_IPV4:-}
  DASHBOARD_HOSTNAME: ${DASHBOARD_HOSTNAME:-}
  DASHBOARD_UPSTREAM: ${DASHBOARD_UPSTREAM:-api:3000}
  DEPLOY_WORKER_CONCURRENCY: ${DEPLOY_WORKER_CONCURRENCY:-4}
  BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-1200}
  DRAIN_SECONDS: ${DRAIN_SECONDS:-15}
  RELEASES_TO_RETAIN: ${RELEASES_TO_RETAIN:-5}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
  GITHUB_MODE: ${GITHUB_MODE:-disabled}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17.11-alpine
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: deployforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deployforge
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployforge -d deployforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.8-alpine
    <<: *hardening
    cap_add: [CHOWN, SETGID, SETUID]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [control]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11.4-alpine
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/bootstrap.json"]
    labels:
      io.deployforge.role: proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/bootstrap.json:/etc/caddy/bootstrap.json:ro
      - caddy_data:/data        # certificates and ACME account: back this up
      - caddy_config:/config    # autosaved last-known-good routes
      - caddy_admin:/run/caddy-admin
    networks:
      control:
        aliases: [caddy]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/caddy-admin/admin.sock"]
      interval: 10s
      timeout: 3s
      retries: 10

  runner:
    image: deployforge/runner:${DEPLOYFORGE_VERSION:-local}
    build:
      context: ../services/runner
      secrets: [build_ca]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}
      RUNNER_LISTEN_NETWORK: deployforge-control
      RUNNER_ATTACH_SELF: "true"
      RUNNER_MAX_CONCURRENT_BUILDS: ${RUNNER_MAX_CONCURRENT_BUILDS:-2}
      RUNNER_GIT_ALLOWED_HOSTS: github.com
      RUNNER_GIT_INSECURE_HTTP_HOSTS: ${RUNNER_GIT_INSECURE_HTTP_HOSTS:-}
      RUNNER_WORK_DIR: /var/lib/deployforge-runner/work
    volumes:
      # Host-level privilege: see docs/threat-model.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_work:/var/lib/deployforge-runner/work
    networks:
      control:
        aliases: [runner]
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: deployforge/api:${DEPLOYFORGE_VERSION:-local}
    pull_policy: never
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://deployforge:${POSTGRES_PASSWORD}@postgres:5432/deployforge
    depends_on:
      postgres: { condition: service_healthy }
    networks: [control]
    restart: "no"

  api:
    image: deployforge/api:${DEPLOYFORGE_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      secrets: [build_ca]
    <<: *hardening
    environment:
      <<: *control-env
      DEPLOYFORGE_PROCESS: api
    volumes:
      - caddy_admin:/run/caddy-admin
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks:
      control:
        aliases: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: deployforge/api:${DEPLOYFORGE_VERSION:-local}
    pull_policy: never
    <<: *hardening
    environment:
      <<: *control-env
      DEPLOYFORGE_PROCESS: worker
      # The worker serves only health endpoints, on loopback.
      HOST: 127.0.0.1
    volumes:
      - caddy_admin:/run/caddy-admin
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      runner: { condition: service_healthy }
      caddy: { condition: service_started }
    networks: [control]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  control:
    name: deployforge-control

secrets:
  # Optional extra CA bundle for builds behind a TLS-intercepting proxy.
  build_ca:
    file: ${DEPLOYFORGE_BUILD_CA:-/dev/null}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  caddy_admin:
  runner_work:
